{% extends 'base.html' %}
{% block content %}
<h2>Vocabulary</h2>
<ul class="list-group">
  {% for word, data in vocab.items() %}
  <li class="list-group-item d-flex justify-content-between align-items-center">
    {{ word }}
    <span>{{ data.translation or '' }} ({{ data.transliteration }})</span>
  </li>
  {% endfor %}
</ul>
{% endblock %}
